# Évite la mise en pause du projet Supabase gratuit (7 jours sans activité) : une requête par jour.
# Aucune donnée sensible : URL et clé publiable sont déjà dans le code de la boutique.
name: Supabase keep-alive

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Interroger l'API
        run: |
          curl --fail --silent --show-error \
            "https://skmhnhnpssnejjvjhyjo.supabase.co/rest/v1/catalog_versions?select=id,version" \
            -H "apikey: sb_publishable_BLKiUFYyM7jZ4W1b9RST1A_UzPETp5V" \
            -H "Authorization: Bearer sb_publishable_BLKiUFYyM7jZ4W1b9RST1A_UzPETp5V"
          echo
