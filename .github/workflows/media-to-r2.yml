# Copie les vidéos de marque (Supabase Storage → R2 public, trafic sortant illimité). À lancer à la main.
# Secrets : CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY. Bucket : kodaclothing-media (accès public activé).
name: Media → R2

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SOURCE: https://skmhnhnpssnejjvjhyjo.supabase.co/storage/v1/object/public/media/marketing
      BUCKET: kodaclothing-media
    steps:
      - name: Copier les fichiers
        run: |
          for f in koda-hero.mp4 koda-hero.jpg koda-story.mp4 koda-story.jpg; do
            curl -fsSL "$SOURCE/$f" -o "$f"
            case "$f" in *.mp4) type=video/mp4 ;; *.jpg) type=image/jpeg ;; esac
            aws s3 cp "$f" "s3://$BUCKET/marketing/$f" --endpoint-url "$R2_ENDPOINT" --content-type "$type" \
              --cache-control "public, max-age=31536000, immutable" --only-show-errors
            echo "✓ $f"
          done
          echo "Fichiers copiés dans R2 : marketing/koda-hero.*, marketing/koda-story.*" >> "$GITHUB_STEP_SUMMARY"
