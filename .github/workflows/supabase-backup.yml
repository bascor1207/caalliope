# Sauvegarde nocturne de la base Supabase (plan gratuit = pas de sauvegarde incluse) vers un bucket R2 privé.
# Jamais d'artefact GitHub : le dépôt est public. Secrets attendus :
#   SUPABASE_DB_URL  : chaîne « Session pooler » (port 5432) avec l'utilisateur postgres
#   CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (jeton API R2 « Object Read & Write » sur le bucket)
# Bucket : kodaclothing-backups (privé). Règle de cycle de vie conseillée dans R2 : supprimer après 30 jours.
name: Supabase backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: kodaclothing-backups
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning::Secrets de sauvegarde absents (SUPABASE_DB_URL, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) : sauvegarde ignorée."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer pg_dump 17
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Exporter la base
        if: steps.config.outputs.ready == 'true'
        run: |
          FILE="koda-$(date -u +%Y-%m-%dT%H%MZ).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage --file="$FILE"
          ls -la "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Envoyer vers R2
        if: steps.config.outputs.ready == 'true'
        run: |
          aws s3 cp "$FILE" "s3://$BUCKET/$FILE" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "Sauvegarde envoyée : $FILE" >> "$GITHUB_STEP_SUMMARY"
          aws s3 ls "s3://$BUCKET/" --endpoint-url "$R2_ENDPOINT" | tail -5 >> "$GITHUB_STEP_SUMMARY"
